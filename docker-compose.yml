version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: chepoel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: chepoel_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init_schema.sql:/docker-entrypoint-initdb.d/01_init_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d chepoel_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: chepoel_python_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:password@postgres:5432/chepoel_db
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
